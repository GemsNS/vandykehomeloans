# HTTP — enable with: a2ensite vandykehomeloans.net.conf
# Unique backend port: 3010 (do not reuse ports from other sites on this VM)
#
# Split layout:
#   /var/www/vandykehomeloans.net/public_html  → DocumentRoot (static)
#   /var/www/vandykehomeloans.net/backend      → Next.js (PM2, 127.0.0.1:3010)
#
# VanDyke is a Next.js App Router app (pages + Server Actions). Proxy `/` to Node
# in addition to `/api` and `/uploads` so the site and admin work correctly.

<VirtualHost *:80>
    ServerName vandykehomeloans.net
    ServerAlias www.vandykehomeloans.net

    DocumentRoot /var/www/vandykehomeloans.net/public_html

    <Directory /var/www/vandykehomeloans.net/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

    # More specific proxies first (same pattern as other sites on this VM)
    ProxyPass        /api     http://127.0.0.1:3010/api
    ProxyPassReverse /api     http://127.0.0.1:3010/api
    ProxyPass        /uploads http://127.0.0.1:3010/uploads
    ProxyPassReverse /uploads http://127.0.0.1:3010/uploads

    # Full Next.js app (required for RSC, Server Actions, /admin, /_next)
    ProxyPass        /_next   http://127.0.0.1:3010/_next
    ProxyPassReverse /_next   http://127.0.0.1:3010/_next
    ProxyPass        /        http://127.0.0.1:3010/
    ProxyPassReverse /        http://127.0.0.1:3010/

    ErrorLog ${APACHE_LOG_DIR}/vandykehomeloans-error.log
    CustomLog ${APACHE_LOG_DIR}/vandykehomeloans-access.log combined
</VirtualHost>
