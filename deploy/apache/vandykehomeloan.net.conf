# HTTP — enable with: a2ensite vandykehomeloan.net.conf
# Unique backend port: 3010 (do not reuse ports from other sites on this VM)
#
# Primary public URL: https://vandyke.loans
# Legacy aliases: vandykehomeloan.net / www.*
#
# Split layout:
#   /var/www/vandykehomeloan.net/public_html  → DocumentRoot (static)
#   /var/www/vandykehomeloan.net/backend      → Next.js (PM2, 127.0.0.1:3010)

<VirtualHost *:80>
    ServerName vandyke.loans
    ServerAlias www.vandyke.loans vandykehomeloan.net www.vandykehomeloan.net

    DocumentRoot /var/www/vandykehomeloan.net/public_html

    <Directory /var/www/vandykehomeloan.net/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

    ProxyPass        /api     http://127.0.0.1:3010/api
    ProxyPassReverse /api     http://127.0.0.1:3010/api
    ProxyPass        /uploads http://127.0.0.1:3010/uploads
    ProxyPassReverse /uploads http://127.0.0.1:3010/uploads
    ProxyPass        /_next   http://127.0.0.1:3010/_next
    ProxyPassReverse /_next   http://127.0.0.1:3010/_next
    ProxyPass        /        http://127.0.0.1:3010/
    ProxyPassReverse /        http://127.0.0.1:3010/

    ErrorLog ${APACHE_LOG_DIR}/vandykehomeloan-error.log
    CustomLog ${APACHE_LOG_DIR}/vandykehomeloan-access.log combined

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =vandyke.loans [OR]
    RewriteCond %{SERVER_NAME} =www.vandyke.loans [OR]
    RewriteCond %{SERVER_NAME} =vandykehomeloan.net [OR]
    RewriteCond %{SERVER_NAME} =www.vandykehomeloan.net
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
