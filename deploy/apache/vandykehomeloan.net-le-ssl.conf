# SSL — certbot --apache --cert-name vandykehomeloan.net --expand \
#   -d vandyke.loans -d www.vandyke.loans -d vandykehomeloan.net -d www.vandykehomeloan.net
#
# Primary public URL: https://vandyke.loans
# Unique backend port: 3010 — must match backend/.env PORT and PM2.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName vandyke.loans
    ServerAlias www.vandyke.loans vandykehomeloan.net www.vandykehomeloan.net

    DocumentRoot /var/www/vandykehomeloan.net/public_html

    <Directory /var/www/vandykehomeloan.net/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

    ProxyPass        /api     http://127.0.0.1:3010/api
    ProxyPassReverse /api     http://127.0.0.1:3010/api
    ProxyPass        /uploads http://127.0.0.1:3010/uploads
    ProxyPassReverse /uploads http://127.0.0.1:3010/uploads
    ProxyPass        /_next   http://127.0.0.1:3010/_next
    ProxyPassReverse /_next   http://127.0.0.1:3010/_next
    ProxyPass        /        http://127.0.0.1:3010/
    ProxyPassReverse /        http://127.0.0.1:3010/

    ErrorLog ${APACHE_LOG_DIR}/vandykehomeloan-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/vandykehomeloan-ssl-access.log combined

    SSLCertificateFile      /etc/letsencrypt/live/vandykehomeloan.net/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/vandykehomeloan.net/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
